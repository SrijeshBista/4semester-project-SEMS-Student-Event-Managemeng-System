<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/Style.css" />
    <link rel="icon" href="../../img/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>SEMS</title>
  </head>
  <body>
    <!-- arrow For home  -->
    <a href="../Homepage.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Home
    </a>

    <!-- Logon Section  -->

    <section id="login">
      <div class="container">
        <div class="login-main">
          <!-- Left -->

          <div class="login-left">
            <img src="../../img/login-illustration.jpg" alt="Login" />
          </div>

          <!-- Right -->

          <div class="login-right">
            <h2>Welcome Back 👋</h2>

            <p>
              Login to continue managing and participating in college events.
            </p>

            <form>
              <div class="input-box">
                <i class="fa-solid fa-envelope"></i>

                <input type="email" placeholder="College Email" required />
              </div>

              <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input type="password" placeholder="Password" required />
              </div>

              <div class="login-option">
                <label>
                  <input type="checkbox" />

                  Remember Me
                </label>

                <a href="../Loginsignup/forgotpass.html">Forgot Password?</a>
              </div>

              <button>Login</button>

              <div class="login-links">
                <p>
                  Don't have an account?

                  <a href="Signup.html"> Create Student Account </a>
                </p>

                <p>
                  Want to organize events?

                  <a href="../Loginsignup/Becomehost.html"> Become an Event Host </a>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
