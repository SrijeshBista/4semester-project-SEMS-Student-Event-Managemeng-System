<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/Style.css" />
    <link rel="icon" href="../../img/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <title>Create Student Account</title>
  </head>

  <body>
    <a href="../Login&signup/Adminlogin.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i>

      Back to Home
    </a>

    <section id="signup">
      <div class="container">
        <div class="signup-main">
          <!-- LEFT -->

          <div class="signup-left">
            <img
              src="../../img/login-illustration.jpg"
              alt="Signup Illustration"
            />
          </div>

          <!-- RIGHT -->

          <div class="signup-right">
            <h2>Create Student Account</h2>

            <p>Join SEMS and start participating in exciting college events.</p>

            <form>
              <input type="text" placeholder="Full Name" required />

              <input type="text" placeholder="Student ID" required />

              <input type="email" placeholder="College Email" required />

              <input type="tel" placeholder="Phone Number" required />

              <select required>
                <option value="">Select Department</option>

                <option>BCA</option>
                <option>BBS</option>
                <option>BIM</option>
                <option>BIT</option>
              </select>

              <select required>
                <option value="">Select Semester</option>

                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
              </select>

              <input type="password" placeholder="Password" required />

              <input type="password" placeholder="Confirm Password" required />

              <button>Create Account</button>

              <div class="login-link">
                Already have an account?

                <a href="../Login&signup/Adminlogin.html"> Login Here </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
