<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEMS</title>
    <link rel="stylesheet" href="../../css/Style.css" />
    <link rel="icon" href="../../img/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- Back Button -->

    <a href="../loginsignup/Adminlogin.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i>

      Back to Login
    </a>

    <section id="forgot-password">
      <div class="container">
        <div class="forgot-main">
          <!-- Left -->

          <div class="forgot-left">
            <img src="../../img/login-illustration.jpg" alt="Forgot Password" />
          </div>

          <!-- Right -->

          <div class="forgot-right">
            <h2>Forgot Password?</h2>

            <p>
              Enter your registered college email address. We'll send you a
              password reset link.
            </p>

            <form>
              <div class="input-box">
                <i class="fa-solid fa-envelope"></i>

                <input type="email" placeholder="College Email" required />
              </div>

              <button>Send Reset Link</button>
            </form>

            <div class="login-link">
              Remember your password?

              <a href="../loginsignup/Adminlogin.html"> Login Here </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
